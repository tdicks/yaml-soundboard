# Soundboard configuration.
#
# Button types:
#   type: file    -> plays the single MP3 in `file`
#   type: random  -> plays one randomly chosen MP3 from `files` and/or `list`
#
# `list` refers to a name under the `lists:` section below, and may be a single
# name or a sequence of names. It can be combined with an inline `files:` list.
#
# `category` refers to a name under the `categories:` section. It supplies the
# button colour and is shown in the button's top-left corner. A button can still
# set `colour:` directly to override the category colour.
#
# Colours pick a Tailwind palette (see COLOURS in app.js):
#   slate, red, orange, amber, yellow, lime, green, emerald, teal, cyan,
#   sky, blue, indigo, violet, purple, fuchsia, pink, rose

title: GTA Soundboard

categories:
  bites:
    name: Bite
    colour: red

  commercials:
    name: Commercial
    colour: sky

  lazlow:
    name: Lazlow
    colour: purple

  ed:
    name: Ed
    colour: lime

  phones:
    name: Phone-In
    colour: teal

  misc:
    name: Misc
    colour: amber

  mixed:
    name: Mixed
    colour: fuchsia

